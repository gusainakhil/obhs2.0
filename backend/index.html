<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backend Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .maintenance-box {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 45px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .icon {
      font-size: 70px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 15px;
      color: #facc15;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #e5e7eb;
      margin-bottom: 10px;
    }

    .small-text {
      margin-top: 25px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .loader {
      margin: 25px auto 0;
      width: 45px;
      height: 45px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 26px;
      }

      p {
        font-size: 16px;
      }

      .maintenance-box {
        padding: 35px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="maintenance-box">
    <div class="icon">🛠️</div>

    <h1>Backend Under Maintenance</h1>

    <p>
      Our backend system is currently under maintenance.
    </p>

    <p>
      Please try again after some time or contact the administrator.
    </p>

    <div class="loader"></div>

    <div class="small-text">
      Thank you for your patience.
    </div>
  </div>

</body>
</html>
